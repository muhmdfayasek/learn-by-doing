<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="styles.css" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />

        <title>To-Do list</title>
        
    </head>
    <body>
        <div class="header">
            <h1>Dynamic Task & Habit Tracker</h1>
        </div>

        <div class="main-section">
            <!-- Form -->
            <form class="habit-form">
                <input type="text" id="habit-input" placeholder="Enter habits here....." />
                <button type="button" class="add-btn">Add</button>
            </form>

            <!-- Incompleted and added tasks -->
            <div class="tasks">
                <!-- Head of incompleted tasks -->
                <div class="task-head">
                    <h2 class="section-head">Tasks</h2>
                    <h3 class="habit-count">0</h3>
                </div>

                <!-- List of added habits -->
                <ul id="habit-list">
                    <!-- <li>
                        <div>
                            <h4 class="habit-date">${value.date}</h4>
                            <p class="habit-display">${value.habit}</p>
                        </div>
                        <div class="section-btn">
                            <button class="list-btn edit-btn"><i class="bi bi-pencil-fill"></i></button>
                            <button class="list-btn delete-btn"><i class="bi bi-trash-fill"></i></button>
                            <input type="checkbox" class="list-btn isCompleted ">
                        </div>
                    </li> -->
                </ul>
            </div>

            <!-- Completed tasks -->
            <div class="completed">
                <!-- Head of completed tasks -->
                <div class="completed-head">
                    <h2 class="section-head">Completed</h2>
                    <h3 class="habit-count">0</h3>
                </div>

                <!-- List of completed habits -->
                <ul id="completed-habit-list">
                    <!-- <li>
                            <div>
                                <h4 class="habit-date">${value.date}</h4>
                                <p class="habit-display">${value.habit}</p>
                            </div>
                            <div class="section-btn">
                                <button class="list-btn delete-btn"><i class="bi bi-trash-fill"></i></button>
                                <input type="checkbox" ${value.completed ? 'checked' : ''}  class="list-btn isCompleted ">
                            </div>
                    </li> -->
                </ul>
            </div>
        </div>
        <script src="scripts.js"></script>
    </body>
</html>
