<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="style.css" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
        <title>Finance-Expense Tracker</title>
    </head>
    <body>
        <div class="container">
            <div class="head">
                <h1>Welcome User</h1>
            </div>

            <div class="second-container">
                <!-- Income form section -->
                <div class="income-container">
                    <h2>Income:</h2>
                    <form action="" class="income-form">
                        <input type="text" id="income-name" placeholder="Income name" />
                        <input type="number" id="income-amount" placeholder="Your Income" />
                        <button type="submit">Add Income</button>
                    </form>
                </div>

                <!-- Expense form section -->
                <div class="expense-container">
                    <h2>Expense:</h2>
                    <form action="" class="expense-form">
                        <input type="text" id="expense-name" placeholder="Expense name" />
                        <input type="number" id="expense-amount" placeholder="Amount" />
                        <input type="date" id="expense-date" />
                        <button type="submit">Add Expense</button>
                    </form>
                </div>
            </div>

            <div class="third-container">
                <!-- Table that show info of income & expense -->
                <div class="info-table"> 
                    <table>
                        <!-- <thead>
                        <tr>
                            <th>Name</th>
                            <th>Amount</th>
                            <th>Date</th>
                            <th></th>
                        </tr>
                    </thead> -->
                        <tbody id="table-tbody">
                            <tr class="tr-expense">
                                <td>Travel</td>
                                <td>500</td>
                                <td>04/01/2026</td>
                                <td class="manipulation">
                                    <button class="edit-btn bi bi-pencil-fill"></button>
                                    <button class="dlt-btn bi bi-trash-fill"></button>
                                </td>
                            </tr>
                            <tr class="tr-income">
                                <td>Stock</td>
                                <td>1000</td>
                                <td>06/01/2026</td>
                                <td class="manipulation">
                                    <button class="edit-btn bi bi-pencil-fill"></button>
                                    <button class="dlt-btn bi bi-trash-fill"></button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- List of total income , expense & balance -->
                <div class="total">
                    <div class="income-total">
                        <p>Total Income</p>
                        <span class="money-count" id="income-total-count">1000</span>
                    </div>
                    <div class="expense-total">
                        <p>Total Expense</p>
                        <span class="money-count" id="expense-total-count">1000</span>
                    </div>
                    <div class="balance">
                        <p>Balance</p>
                        <span class="money-count" id="balance-total-count">1000</span>
                    </div>
                </div>
            </div>
        </div>


        <!-- Section Pop-up if user click on edit button -->
        <div class="editing-box" style="display: none;">
            <form action="" class="editing-form">
                <h1 class="edit-head">Edit content</h1>
                <input type="text" id="edited-name" placeholder="Edit name" />
                <input type="number" id="edited-amount" placeholder="Amount" />
                <input type="date" id="edited-date" />
                <div class="button-section">
                    <button type="button">Cancel</button>
                    <button type="submit">Add Expense</button>
                </div>
            </form>
        </div>

        <script src="script.js"></script>
    </body>
</html>
