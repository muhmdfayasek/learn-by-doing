<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="style.css" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
        <title>Finance-Expense Tracker</title>
    </head>
    <body>
        <div class="container">
            <div class="head">
                <h1>Welcome User</h1>
            </div>

            <div class="second-container">
                <div class="income-container">
                    <h2>Income:</h2>
                    <form action="" class="income-form">
                        <input type="text" id="income-name" placeholder="Income name" />
                        <input type="number" id="income-input" placeholder="Your Income" />
                        <button type="submit">Add Income</button>
                    </form>
                </div>

                <div class="expense-container">
                    <h2>Expense:</h2>
                    <form action="" class="expense-form">
                        <input type="text" name="" id="expense-name" placeholder="Expense name" />
                        <input type="number" name="" id="expense-amount" placeholder="Amount" />
                        <select name="" id="expense-category">
                            <option value="">Select Category</option>
                            <option value="Home">Home</option>
                            <option value="Food">Food</option>
                            <option value="Transport">Transport</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Other">Other</option>
                        </select>
                        <input type="date" name="" id="expense-date" />
                        <button type="submit">Add Expense</button>
                    </form>
                </div>
            </div>

            <div class="third-container">
                <div class="info-table">
                    <table>
                        <!-- <thead>
                        <tr>
                            <th>Name</th>
                            <th>Amount</th>
                            <th>Category</th>
                            <th>Date</th>
                            <th></th>
                        </tr>
                    </thead> -->
                        <tbody>
                            <tr class="tr-expense">
                                <td>Travel</td>
                                <td>500</td>
                                <td>Transport</td>
                                <td>04/01/2026</td>
                                <td class="manipulation">
                                    <button class="edit-btn"><i class="bi bi-pencil-fill"></i></button>
                                    <button class="dlt-btn"><i class="bi bi-trash-fill"></i></button>
                                </td>
                            </tr>
                            <tr class="tr-income">
                                <td>Stock</td>
                                <td>1000</td>
                                <td>Income</td>
                                <td>06/01/2026</td>
                                <td class="manipulation">
                                    <button class="edit-btn"><i class="bi bi-pencil-fill"></i></button>
                                    <button class="dlt-btn"><i class="bi bi-trash-fill"></i></button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="total">
                    <div class="income-total">Total Income</div>
                    <div class="expense-total">Total Expense</div>
                    <div class="balance">Balance</div>
                </div>
            </div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
